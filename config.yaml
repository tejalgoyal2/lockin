# Everything tunable for the scanner lives here (SPEC.md).
# Regexes are Python `re` syntax. Patterns under `*_cs` are case-sensitive;
# all others are case-insensitive.

freshness:
  default_days: 7        # normal run: only jobs first seen in the last N days. A week: a posting older than that has most of its
                         # applicants already, and a week still covers several skipped or failed runs (GitHub drops scheduled
                         # runs now and then). seen.json keeps a job from coming twice. since_days 14 / 30 widens it for one run.
  first_run_days: 7      # used instead when state/seen.json does not exist yet (the first run)

sources:
  feashliaa:
    enabled: true
    repo_url: https://github.com/Feashliaa/job-board-data
    cache_dir: .cache/job-board-data
    stale_after_hours: 36   # warn (and continue) if metadata last_updated is older
  simplify:
    enabled: true
    listings_url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
    # Simplify's internship list (same format; about 450 open Canadian internships and co-ops). Its rows are tagged
    # Internship, never "new grad". Remove the line to read the new-grad list only.
    internships_url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
    categories:             # Simplify has used a few spellings for the same buckets
      - Software
      - Software Engineering
      - AI/ML/Data
      - Data Science, AI & Machine Learning

  yc:                      # Y Combinator's job pages (ycombinator.com/jobs); postings asking 3+ years are skipped up front
    enabled: true
    pages: [canada, toronto, vancouver]     # /jobs/location/<page>
  builtin:                 # Built In Vancouver: entry-level cards by category (builtinvancouver.org)
    enabled: true
    base_url: https://builtinvancouver.org
    paths: [/jobs/dev-engineering/entry-level, /jobs/data-analytics/entry-level, /jobs/entry-level]
    max_pages: 3           # per path; a page with nothing inside the freshness window ends the walk earlier
  baystreet:               # Bay Street Oracle: capital-markets jobs (a few quant / data / software roles among them)
    enabled: true
    sitemap_url: https://www.baystreetoracle.ca/jobs/sitemap.xml
  hn:                      # the monthly "Ask HN: Who is hiring?" thread (Algolia HN API)
    enabled: true
  jobbank:                 # Job Bank (jobbank.gc.ca): the federal job board; its results also carry the partner sites' postings,
                           # CivicJobs.ca (municipal jobs) among them. Each occupation and keyword is paged 25 at a time, newest first
    enabled: true
    max_days: 5            # a normal run asks for the last 5 days only (runs are 8 h apart; seen.json remembers the rest, and 5 days survives a dropped run or two).
                           # --since N / the Actions input since_days asks for the full N days instead
    max_pages: 12          # results pages per search (300 postings)
    max_queries: 200       # requests per run, 5 s apart (17 minutes at the very most)
    nocs:                  # NOC 2021 occupation codes
      - "21211"            # data scientists
      - "21210"            # mathematicians, statisticians and actuaries
      - "21220"            # cybersecurity specialists
      - "21221"            # business systems specialists
      - "21222"            # information systems specialists
      - "21223"            # database analysts and data administrators
      - "21230"            # computer systems developers and programmers
      - "21231"            # software engineers and designers
      - "21232"            # software developers and programmers
      - "21233"            # web designers
      - "21234"            # web developers and programmers
      - "22220"            # computer network and web technicians
      - "22221"            # user support technicians
      - "22222"            # information systems testing technicians
      - "21311"            # computer engineers (except software engineers and designers)
    terms:                 # keywords for roles filed under other occupations
      - data analyst
      - business intelligence
      - devops
      - cloud
      - machine learning
      - qa analyst
      - gis analyst
      - technical analyst
      - application
      - programmer analyst
      - software
      - programmer
      - web developer
      - database
      - network administrator
      - cybersecurity
      - it support
      - help desk
      - quality assurance
      - embedded
      - python
      - java
  jobicy:                  # Jobicy: remote jobs open to Canada (public JSON API, no key; one request an hour per query is its limit)
    enabled: true
  googlejobs:              # Google for Jobs through SerpApi: LinkedIn, Indeed, Glassdoor and company-site postings, each with its full
                           # description. Free key (serpapi.com, 250 searches a month) -> secret SERPAPI_KEY; skipped without it
    enabled: true
    location: British Columbia, Canada     # Google's place for the search (remote jobs open to it come too)
    queries_per_run: 2     # SerpApi's free 250 a month is shared with Site Search: (2 + 2) x 2 runs a day x 30 days = 240
    terms: [junior software developer, software engineer new grad, entry level software engineer, junior data analyst,
            data engineer, junior python developer, full stack developer, cybersecurity analyst, IT support analyst,
            machine learning engineer, devops engineer, QA automation engineer, business intelligence analyst,
            junior web developer, cloud engineer, software developer co-op new graduate, systems analyst, AI engineer,
            technical support engineer, application support analyst, data scientist, junior backend developer,
            database administrator, network engineer]
  sitesearch:              # the recruiter's Boolean trick on the ATS sites (site:jobs.ashbyhq.com ("software engineer" OR ...) Canada),
                           # run through a search API: Brave (BRAVE_SEARCH_API_KEY, ~1,000 free searches a month) or SerpApi
                           # (SERPAPI_KEY, shared with Google Jobs). Skipped without either key
    enabled: true
    brave_per_run: 15      # 15 x 2 runs a day x 30 days = 900 of Brave's ~1,000 free a month
    serpapi_per_run: 2     # only when there is no Brave key
    hosts: [jobs.ashbyhq.com, jobs.lever.co, job-boards.greenhouse.io, boards.greenhouse.io, apply.workable.com,
            myworkdayjobs.com, bamboohr.com, jobs.smartrecruiters.com, icims.com]
    titles:
      - '("software engineer" OR "software developer" OR "full stack" OR "backend" OR "frontend")'
      - '("junior" OR "new grad" OR "entry level" OR "graduate" OR "associate") (developer OR engineer OR analyst)'
      - '("data analyst" OR "data engineer" OR "data scientist" OR "machine learning" OR "AI engineer")'
      - '("IT support" OR "IT analyst" OR "systems administrator" OR "help desk" OR "technical support")'
      - '("security analyst" OR "cybersecurity" OR "devops" OR "cloud engineer" OR "QA" OR "automation")'
    where: '(Vancouver OR "British Columbia" OR Burnaby OR Victoria OR "Remote Canada" OR Canada)'
  jobhive:                 # ats-scrapers' open dataset (MIT, free, no key): daily snapshots of the hiring systems lockin has no reader
                           # for. Each snapshot is downloaded, its Canadian rows inside the window kept, the description used as the JD.
                           # Greenhouse, Lever, Ashby, BambooHR and iCIMS are read too: the dataset covers every board on them, not
                           # just the watchlist's (a job found both ways is one row). Its Workday, Google and TikTok rows carry no
                           # date, so they are not read.
    enabled: true
    systems: [oracle, smartrecruiters, eightfold, dayforce, ukg, rippling, jazzhr, breezy, cornerstone, phenom, jobvite,
              recruitee, teamtailor, taleo, adp, workable, gem, greenhouse, lever, ashby, bamboohr, icims, uber, apple]
  bcgov:                   # BC Public Service: the provincial government's own job board (one table, about 80 postings)
    enabled: true
  watchlist:               # employers read directly on every run (watchlist.yaml); see scanner/sources/watchlist.py
    enabled: true
    path: watchlist.yaml
    extra_paths: [watchlist.auto.yaml]   # boards the scanner found by itself (read after watchlist.yaml, which wins on a repeat)
    workers: 6             # boards fetched at once; the client still paces requests per host
    auto:                  # board discovery (scanner/boards.py): Canadian postings link to their employer's board; the busiest
      enabled: true        # boards not on the watchlist are read once and, if they list Canadian jobs, added to the first extra path
      per_run: 12          # boards read per run
      max_boards: 150      # stop adding at this many auto boards (each costs a few requests per run)
      min_candidates: 2    # ... and only boards with at least this many Canadian postings whose title passes the title filters
      skip_pattern: 'recruit|staffing|talent|jobgether|survey|lensa|jobot|randstad|adecco|manpower|kforce|\bhays\b|workforce|\bgig\b|crowd'
                           # job aggregators and agencies repost other employers' jobs: never added by themselves
      report_path: reports/boards.md

location:
  # Names that are unambiguous on their own.
  include:
    - '\bCanada\b'
    - '\b(Ontario|British Columbia|Alberta|Quebec|Québec|Manitoba|Saskatchewan|Nova Scotia|New Brunswick|Newfoundland|Labrador|Prince Edward Island|Yukon|Northwest Territories|Nunavut)\b'
    - '\b(Toronto|Vancouver|Montr[ée]al|Ottawa|Waterloo|Kitchener|Calgary|Edmonton|Burnaby|Mississauga|Markham|Kanata|Gatineau|Winnipeg|Regina|Saskatoon|Oakville)\b'
    # More cities that can only be Canadian, so a posting that names just the city ("Guelph", "Kelowna") is not lost
    - '\b(Guelph|Kelowna|Kamloops|Nanaimo|Abbotsford|Coquitlam|Chilliwack|Langford|Squamish|Penticton|New Westminster|Prince George|Brampton|Vaughan|Etobicoke|North York|Barrie|Oshawa|Pickering|Thunder Bay|Sault Ste\.? Marie|St\.? Catharines|Brantford|Sarnia|Timmins|Moncton|Fredericton|Charlottetown|St\.? John[’\x27]s|Lethbridge|Red Deer|Medicine Hat|Fort McMurray|Grande Prairie|Whitehorse|Yellowknife|Iqaluit|Halifax|Victoria)\b'
    # Names shared with places outside Canada: require a province qualifier.
    - '\b(Victoria|Richmond|Surrey|Hamilton|London|Halifax),?\s+(BC|ON|NS|British Columbia|Ontario|Nova Scotia)\b'
    - 'Remote\s*\(?\s*Canada'
    - 'Canada\s*[-–]\s*Remote'
  # Province suffixes, case-sensitive so ", on" in prose does not match.
  include_cs:
    - ',\s*(ON|BC|AB|QC|MB|SK|NS|NB|NL|PE|PEI|YT|NT|NU)\b'
    - '\(CAN\)|\bCAN\b(?!\s*-?\s*\d)'     # "KOHO (CAN)", "CAN - Remote"
  # Known false positives. Matching spans are removed from the string BEFORE the
  # include test, so "Seattle, WA; Toronto, ON" still passes but "Vancouver, WA" does not.
  # "United States"/"USA" need no entry: a string with no Canadian location left is dropped.
  exclude:
    - 'Vancouver,?\s+(Washington|WA)\b'
    - 'Ottawa,?\s+(Illinois|IL)\b'
    - '\b(Waterloo|Markham|Edmonton),?\s+(Wisconsin|WI|Iowa|IA|Illinois|IL|Kentucky|KY|Nebraska|NE|Belgium|BE|Brussels)\b'
    # "Ontario, CA" and nothing else is Ontario, California (an Owens & Minor warehouse job reached the Feed); "Toronto, Ontario,
    # CA" keeps its city and passes. The whole-string anchors keep "Remote, Ontario, CA" (Canada) alone.
    - '^\s*Ontario,\s*(?:CA|California)\s*$'
    - '\bNew Brunswick,?\s+(?:NJ|New Jersey)\b'     # New Brunswick, New Jersey
    # Halifax and Victoria alone are taken as Canadian (Halifax, Nova Scotia; Victoria, BC), except these
    - '\bHalifax,?\s+(?:UK|United Kingdom|England|West Yorkshire|Yorkshire|VA|Virginia|MA|Massachusetts)\b'
    - '\bVictoria,?\s+(?:Australia|AU|AUS|VIC|TX|Texas|Seychelles|Mah[ée]|Hong Kong|Malta|Gozo|London|UK)\b'
    - '\b(?:Melbourne|Geelong|Ballarat|Bendigo)\b[^;|]*'
    - '\bVictoria\s+(?:Street|St\.?|Road|Rd\.?|Avenue|Ave\.?|Station|Square|Embankment|Park|Island|Falls|Harbour)\b'
  exclude_cs:
    - ',\s*WA\b'
  split_on: '[;|]'   # multi-location strings are split on this; first Canadian part is used
  # The owner cannot work in French: a job is dropped when EVERY Canadian location it lists is in
  # Quebec. A posting that also lists a non-Quebec location or "Remote, Canada" is kept.
  quebec:
    - '\b(Montr[ée]al|Qu[ée]bec|Laval|Gatineau|Longueuil|Sherbrooke|L[ée]vis|Saint-Laurent|St\.?\s+Laurent)\b'
  quebec_cs:             # province abbreviation, case-sensitive
    - ',\s*QC\b'
    - '\bQC\s*[,-]'
    - '^QC$'
  # The Feed's Province tags. A job gets the tag of every wanted province it lists, plus Remote when a place or the
  # title says so ("Remote - British Columbia" is BC + Remote). A job only in another province (Saskatchewan, Manitoba,
  # the Atlantic provinces, the territories) is dropped (`drop_other_areas`); one whose place names no province
  # ("Canada", "Smalltown, Canada") is tagged Canada.
  areas:
    BC:
      - '\bBritish Columbia\b|\bB\.C\.'
      - '\b(?:Vancouver|Burnaby|Victoria|Surrey|Richmond(?!\s+Hill)|Kelowna|Kamloops|Nanaimo|Abbotsford|Coquitlam|Langley|Squamish|New Westminster|Chilliwack|Penticton|Prince George|Langford|Whistler|Port Moody|Maple Ridge|Saanich|Vernon|Courtenay|Cranbrook|Fort St\.? John|Kitimat|North Vancouver|West Vancouver|Delta, BC)\b'
    BC_cs:
      - '\bBC\b'
    Remote:
      - '\bremote\b|work from home|\bWFH\b|anywhere in Canada|home[- ]based|Home-Canada|telecommut|telework'
    Alberta:
      - '\bAlberta\b'
      - '\b(?:Calgary|Edmonton|Red Deer|Lethbridge|Medicine Hat|Fort McMurray|Grande Prairie|Airdrie|Banff|Canmore|Cochrane|Okotoks|Leduc|Sherwood Park|St\.? Albert|Spruce Grove)\b'
    Alberta_cs:
      - '\bAB\b'
    Ontario:
      - '\bOntario\b'
      - '\b(?:Toronto|Ottawa|Mississauga|Waterloo|Kitchener|Markham|Kanata|Oakville|Brampton|Vaughan|Guelph|Hamilton|Barrie|Oshawa|Whitby|Pickering|Ajax|Burlington|Richmond Hill|North York|Etobicoke|Scarborough|Sarnia|Thunder Bay|Sudbury|Kingston|Cambridge|Milton|Newmarket|Aurora|Sault Ste\.? Marie|St\.? Catharines|Niagara|Brantford|Peterborough|Windsor|London|Belleville|Timmins|North Bay|Woodbridge|Concord|Bolton|Stoney Creek)\b'
    Ontario_cs:
      - '\bON\b(?![- ]?SITE)'
    other:                     # another province or territory, or Quebec
      - '\b(?:Saskatchewan|Manitoba|Nova Scotia|New Brunswick|Newfoundland|Labrador|Prince Edward Island|Yukon|Northwest Territories|Nunavut|Qu[ée]bec)\b'
      - '\b(?:Regina|Saskatoon|Winnipeg|Halifax|Dartmouth|Bedford|Moncton|Fredericton|Saint John|St\.? John[’\x27]s|Charlottetown|Whitehorse|Yellowknife|Iqaluit|Montr[ée]al|Laval|Gatineau|Sherbrooke|Longueuil|Norquay|Brandon)\b'
    other_cs:
      - '\b(?:SK|MB|NS|NB|NL|PE|PEI|YT|NT|NU|QC)\b'
  drop_other_areas: true
  # Workday lists "2 Locations" and keeps the real list in the job detail (additionalLocations).
  # These pass the location stage unresolved; phase 2 reads the list. Unresolvable ones are kept.
  unresolved: '^\s*\d+\s+Locations?\s*$'
  # ... and when the list cannot be read (403, no JD) the job is kept only if the primary location in its
  # URL is Canadian (or Quebec). Set true to keep every such job, whatever its URL says.
  keep_unresolved_with_foreign_url: false
  # A title that names a place outside Canada, and no Canadian one, fails the location stage even when the
  # location field says Canada: TribalScale listed "Forward Deployed Engineer (Washington, D.C.)" as "Remote Canada".
  # Whole words, case-insensitive. Ambiguous names (London, Paris, Cambridge: also Ontario towns) are left out.
  title_foreign:
    - 'United States|America(?:n)?-based'
    - 'Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|West Virginia|Wisconsin|Wyoming'
    - 'Washington,?\s*D\.?\s?C\.?|Washington State|San Francisco|Bay Area|Silicon Valley|Los Angeles|LA-based|Seattle|Boston|Chicago|Austin|Dallas|Houston|Denver|Atlanta|Miami|Fort Lauderdale|Philadelphia|Pittsburgh|San Diego|San Jose|Palo Alto|Mountain View|Menlo Park|Sunnyvale|Redwood City|Raleigh|Nashville|Minneapolis|Detroit|Salt Lake City|Las Vegas|Orlando|Tampa|Portland|Kirkland|Bellevue|Redmond|Phoenix'
    - 'm/w/d|w/m/d|m/f/d|f/m/d|d/f/m|m/w/x|w/m/x'       # German / Austrian gender marker: a European posting (one reached the Feed as "British Columbia")
    - 'United Kingdom|England|Scotland|Ireland|Dublin|India|Bangalore|Bengaluru|Hyderabad|Pune|Chennai|Gurugram|Gurgaon|Noida|Germany|Berlin|Munich|Netherlands|Amsterdam|Poland|Warsaw|Mexico|Brazil|Philippines|Manila|Singapore|Australia|Sydney|Japan|Tokyo|Israel|Tel Aviv|Spain|Madrid|Portugal|Lisbon|Argentina|Costa Rica'
  title_foreign_cs:            # case-sensitive abbreviations
    - 'US|USA|U\.S\.(?:A\.)?|NYC|UK|EMEA|APAC|LATAM'

title:
  # Three tiers (scanner/filters.py role_tier). `strong` words name a role the owner targets ("core"): the job is kept
  # unless a full description shows no tech at all. `weak` words name another tech role ("adjacent"); `generic` words
  # (Analyst, Engineer ...) say nothing by themselves, so the description must name the owner's skills (jd.relevance).
  strong:
    - software
    - developer
    - programmer
    - data
    - machine learning
    - cloud
    - devops
    - platform
    - backend
    - back end
    - frontend
    - front end
    - full stack
    - full-stack
    - fullstack
    - security
    - cyber
    - database
    - analytics
    - automation
  strong_words:          # short acronyms: whole-word match, case-insensitive
    - ML
    - AI
    - SRE
  strong_words_cs:       # upper case only: "BI Developer", never "Bi Weekly" (a restaurant Server shift reached the Feed)
    - BI
  generic:
    - engineer
    - analyst
    - specialist
    - scientist
    - graduate             # "2027 Graduate Program", "New Grad Rotational Analyst": kept only when the description is tech
    - new grad
    - rotational
    - early career
  weak:
    - test
    - technical
    - technology           # "Graduate Rotational Program (Technology)": a weak word, so the JD must show a skill fit
    - network              # "Network Administrator" / "Network Operations": entry-level IT the audit showed was lost
    - systems
    - sysadmin
    - help desk
    - helpdesk
    - service desk
    - desktop support
    - information technology
    - information systems
    - computer
    - informatics
    - firmware
    - embedded
    - hardware
    - robotics
    - system administrator
    - systems administrator
    - network administrator
    - server administrator
    - linux administrator
    - windows administrator
    - integration
  weak_words:
    - QA
    - web                  # "Web Designer", "CMS and Web Administrator" (whole word: not "Webber")
  weak_words_cs:         # short acronyms, upper case only ("IT Support", not "it")
    - IT
    - SQL
    - API
    - ETL
    - DBA
    - UX
    - UI
    - SDET
    - NOC
  exclude:
    - senior
    - supervisor
    - superviseur
    - administrative
    - clerk
    - facilities
    - staff
    - principal
    - manager
    - director
    - head of
    - chief
    - intermediate
    - mechanical
    - electrical engineer
    - civil
    - structural
    - chemical
    - process engineer
    - manufacturing
    - HVAC
    - field service
    - sales
    - security guard
    - team leader
    - recruiter
    - vice president
    - vice-president
    - avp
    - assistant vice
    - concierge
    - attendant
    - parking
    - security officer
    - custodian
    - teacher
    - recreation          # city halls: "Recreation Programmer" is a recreation job, not a developer
    - lecturer
    - sessional
    - professor
  exclude_if_weak:       # excluded only when the title's tech match is a generic word (engineer, analyst, specialist ...);
    - coordinator
    - technician
    - marketing           # "Marketing Data Analyst" is a data job; "Marketing Specialist" is not
                         # a strong one ("IT Coordinator", "Data Coordinator", "Cloud Technician") passes
  exclude_words:
    - sr
    - guard
    - VP
    - lead
    - architect
    - architects
  # Whole words / phrases, case- and accent-insensitive ("Directeur", "directeur" and "Directrice" all hit).
  exclude_phrases:
    - directeur
    - directrice
    - director
    - expert
    - phd
    - customer support specialist
    - support specialist, data
    - customer service
    - client support
    - sales support specialist
    - member support specialist
    # "IT Support Specialist" / "Technical Support Specialist" are entry-level tech jobs a new graduate applies to: they are
    # a weak title, so the JD must show a skill fit (the audit found them dropped by the old plain "support specialist" rule).
    - help improve ai
    - english speaker
    - flexible work
    - data annotation
    - data labeling
    - ai trainer
    # non-tech roles that leaked into the Feed (SPEC §11 #67)
    - business developer
    - business development
    - distinguished
    - crew
    - electrician
    - journeyperson
    - operator
    - investigator
    - underwriter
    - artist
    - loss prevention
    - store
    - security agent
    # sales, success and recruiting roles that the watchlist's employers post under "Engineer" / "Specialist"
    - account executive
    - account manager
    - account specialist
    - customer success
    - talent acquisition
  exclude_words_cs:      # roman-numeral levels, case-sensitive
    - II
    - III
    - IV
  # Intern / co-op / student titles. They are kept unless the description requires current enrollment (the owner has
  # graduated), and score at most 3 unless it says graduates may apply.
  student:
    - intern
    - internship
    - interns
    - co-op
    - coop
    - student
    - students
    - PEY
  student_regex:
    - '\b(summer|winter|fall)\s+20\d\d\b'
  grad_signal:           # ... unless the title also says it is for graduates (the season only says when it starts)
    - '\bnew[\s-]?grad'
    - '\brecent\s+grad'
    - '\bgraduate\s+(?:program|programme|role|rotation|developer|engineer|analyst|scientist)'
    - '\bearly[\s-]career'
    - '\bentry[\s-]level'
    - '\brotational'

company:
  blocklist:             # normalised (lowercase, alphanumeric) substring match
    - jobgether
    - usasurveyjob
    - globalhr
    - tsmg
    - mthree                 # train-and-place program, every variant ("mthree Recruiting Portal", ...)
    - liftedsolutions        # AI-training gig work
    - liftedanupworkcompany  # same company under its SmartRecruiters slug

language:
  drop_french_titles: true
  french_pattern: 'analyste|ing[ée]nieur|d[ée]veloppeur|conseill|scientifique|sp[ée]cialiste'
  # A title that also has one of these English role words is bilingual, not French-only.
  english_role_words: [engineer, developer, analyst, scientist, specialist, consultant, programmer, architect]
  # "Développeur de logiciels / Software Developer": when the part before " / " is French the job is
  # dropped even though an English role word follows. Accented letters or any of these words flag it.
  french_first_segment_pattern: '\b(de|du|des|la|le|les|et|pour|chez|aux|en|sur|avec|logiciels?|ing[ée]nieure?|d[ée]veloppeu\w+|analyste|conseill\w+|gestionnaire|charg[ée]e?|technicien\w*|stagiaire|administrateur\w*|architecte)\b|[àâçéèêëîïôûùü]'
  drop_french_required_jd: true   # JD requires French / bilingual skills (a passing mention is not enough)

report:
  path: reports/latest.md
  dropped_path: reports/dropped.md   # the jobs the JD rules dropped, by reason (so a wrong rule can be seen)

jd:
  enabled: true
  workers: 8                 # thread pool; the client still enforces per-host/per-ATS limits
  request_delay: 0.3         # seconds between requests to one host
  host_delays:               # hosts that ask for more: Job Bank's robots.txt has Crawl-delay 5
    www.jobbank.gc.ca: 5
  max_per_ats: 5
  cache_dir: .cache/jd       # successful fetches are cached by URL
  cache_ttl_days: 10         # longer than the freshness window: a job still in the window is not downloaded again
  max_years: 2               # the most experience a posting may ask for. "1-5 years" passes (it starts at 1); "2 years" and
                             # "2+ years" pass as long shots (Exp 3, Score at most 2); "2-5 years", "3 years" and "3+" are dropped
  relevance:                 # is it a tech job? (scanner/enrich.py relevance_reason)
    min_judge_chars: 600     # a description shorter than this is too thin to rule a tech title out by
    generic_min_skills: 2    # a generic title (Analyst, Engineer, Specialist) is kept only when a full description names this many
                             # of the tools in skills.yaml (process words such as Agile do not count); one for a short description
    core_always: '\b(?:software|developer|programmer|devops|sre|full[\s-]?stack|back[\s-]?end|front[\s-]?end|cyber\w*|machine learning|database)\b'
                             # titles that are a tech job whatever the description says (Job Bank postings name no tools)
  no_jd_title_exclude:       # a generic title whose description could not be read is kept as a low score, except these
    - warehouse              # words: they name a field that is plainly not tech
    - retail
