notion:
  api_version: "2026-03-11"   # Notion-Version header; 2026-03-11 renamed `archived` to `in_trash`
  daily_cap: 500              # at most this many rows written per run, best Score first: a safety valve, not a filter
  verify_readback_min_chars: 4000   # after writing, read back a JD at least this long and compare lengths
  # Property names exactly as they appear in the Feed (every one is required; README "Setup" has the types). The
  # scanner never writes `interested` / `apply` / `done_del`. At the start of each run it trashes the rows whose
  # `done_del` box is ticked (the owner's automation ticks it after copying the row to the main database), no other.
  properties:
    name: Name
    company: Company
    link: Link
    score: Score              # Number 1-5: how much the job is worth the owner's time (scanner/rating.py)
    exp: Exp                  # Number 1-3: 1 = asks 0-1 years, 2 = 1-2 years or not stated, 3 = 2 years
    province: Province        # Multi-select: BC, Remote, Alberta, Ontario, Canada (a job can carry two: BC + Remote)
    posted: Posted            # Date the posting was published
    jd: JD
    interested: I             # Interested
    apply: A                  # Apply
    done_del: done-del

state:
  dir: state                  # seen.json (rows already written) and gaps.json
  prune_days: 90

feedback:
  report_path: reports/feedback.md   # what was picked, by Fit band / source / tag (counts only), from state/feedback.json

gaps:
  report_path: reports/gaps.md   # rewritten every Monday (UTC)

applied:
  path: state/applied.json.enc    # Fernet-encrypted; key in env APPLIED_KEY (repo secret). Never commit plaintext

