# Everything tunable for the scanner lives here (SPEC §4, §10).
# Regexes are Python `re` syntax. Patterns under `*_cs` are case-sensitive;
# all others are case-insensitive.

freshness:
  default_days: 10       # normal run: only jobs first seen in the last N days (seen.json keeps a job from coming twice, so a wide
                         # window costs JD fetches, not duplicates; ten days also covers a skipped or failed run: GitHub drops
                         # scheduled runs now and then)
  first_run_days: 14     # used instead when state/seen.json does not exist yet (the first run)

sources:
  feashliaa:
    enabled: true
    repo_url: https://github.com/Feashliaa/job-board-data
    cache_dir: .cache/job-board-data
    stale_after_hours: 36   # warn (and continue) if metadata last_updated is older
  simplify:
    enabled: true
    listings_url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
    categories:             # Simplify has used a few spellings for the same buckets
      - Software
      - Software Engineering
      - AI/ML/Data
      - Data Science, AI & Machine Learning

  yc:                      # Y Combinator's job pages (ycombinator.com/jobs); postings asking 3+ years are skipped up front
    enabled: true
    pages: [canada, toronto, vancouver]     # /jobs/location/<page>
  builtin:                 # Built In Vancouver: entry-level cards by category (builtinvancouver.org)
    enabled: true
    base_url: https://builtinvancouver.org
    paths: [/jobs/dev-engineering/entry-level, /jobs/data-analytics/entry-level, /jobs/entry-level]
    max_pages: 3           # per path; a page with nothing inside the freshness window ends the walk earlier
  baystreet:               # Bay Street Oracle: capital-markets jobs (a few quant / data / software roles among them)
    enabled: true
    sitemap_url: https://www.baystreetoracle.ca/jobs/sitemap.xml
  hn:                      # the monthly "Ask HN: Who is hiring?" thread (Algolia HN API)
    enabled: true
  jobbank:                 # Job Bank (jobbank.gc.ca): the federal job board; its results also carry the partner sites' postings,
                           # CivicJobs.ca (municipal jobs) among them. Each occupation and keyword is paged 25 at a time, newest first
    enabled: true
    max_days: 3            # a normal run asks for the last 3 days only (runs are 12 h apart; seen.json remembers the rest).
                           # --since N / the Actions input since_days asks for the full N days instead
    max_pages: 12          # results pages per search (300 postings)
    max_queries: 200       # requests per run, 5 s apart (17 minutes at the very most)
    nocs:                  # NOC 2021 occupation codes
      - "21211"            # data scientists
      - "21210"            # mathematicians, statisticians and actuaries
      - "21220"            # cybersecurity specialists
      - "21221"            # business systems specialists
      - "21222"            # information systems specialists
      - "21223"            # database analysts and data administrators
      - "21230"            # computer systems developers and programmers
      - "21231"            # software engineers and designers
      - "21232"            # software developers and programmers
      - "21233"            # web designers
      - "21234"            # web developers and programmers
      - "22220"            # computer network and web technicians
      - "22221"            # user support technicians
      - "22222"            # information systems testing technicians
      - "21311"            # computer engineers (except software engineers and designers)
    terms:                 # keywords for roles filed under other occupations
      - data analyst
      - business intelligence
      - devops
      - cloud
      - machine learning
      - qa analyst
      - gis analyst
      - technical analyst
      - application
      - programmer analyst
      - software
      - programmer
      - web developer
      - database
      - network administrator
      - cybersecurity
      - it support
      - help desk
      - quality assurance
      - embedded
      - python
      - java
  canadalist:              # a hand-curated GitHub list of Canadian junior / new-grad jobs, updated daily (README and FINANCE.md)
    enabled: true
    urls:
      - https://raw.githubusercontent.com/hanzili/canada_sde_junior_new_grad_position/main/README.md
      - https://raw.githubusercontent.com/hanzili/canada_sde_junior_new_grad_position/main/FINANCE.md
  bcgov:                   # BC Public Service: the provincial government's own job board (one table, about 80 postings)
    enabled: true
  watchlist:               # employers read directly on every run (watchlist.yaml); see scanner/sources/watchlist.py
    enabled: true
    path: watchlist.yaml
    extra_paths: [watchlist.auto.yaml]   # boards the scanner found by itself (read after watchlist.yaml, which wins on a repeat)
    workers: 6             # boards fetched at once; the client still paces requests per host
    auto:                  # board discovery (scanner/boards.py): Canadian postings link to their employer's board; the busiest
      enabled: true        # boards not on the watchlist are read once and, if they list Canadian jobs, added to the first extra path
      per_run: 12          # boards read per run
      max_boards: 150      # stop adding at this many auto boards (each costs a few requests per run)
      min_candidates: 2    # ... and only boards with at least this many Canadian postings whose title passes the title filters
      skip_pattern: 'recruit|staffing|talent|jobgether|survey|lensa|jobot|randstad|adecco|manpower|kforce|\bhays\b|workforce|\bgig\b|crowd'
                           # job aggregators and agencies repost other employers' jobs: never added by themselves
      report_path: reports/boards.md

location:
  # Names that are unambiguous on their own.
  include:
    - '\bCanada\b'
    - '\b(Ontario|British Columbia|Alberta|Quebec|Québec|Manitoba|Saskatchewan|Nova Scotia|New Brunswick|Newfoundland|Prince Edward Island)\b'
    - '\b(Toronto|Vancouver|Montr[ée]al|Ottawa|Waterloo|Kitchener|Calgary|Edmonton|Burnaby|Mississauga|Markham|Kanata|Gatineau|Winnipeg|Regina|Saskatoon|Oakville)\b'
    # Names shared with places outside Canada: require a province qualifier.
    - '\b(Victoria|Richmond|Surrey|Hamilton|London|Halifax),?\s+(BC|ON|NS|British Columbia|Ontario|Nova Scotia)\b'
    - 'Remote\s*\(?\s*Canada'
    - 'Canada\s*[-–]\s*Remote'
  # Province suffixes, case-sensitive so ", on" in prose does not match.
  include_cs:
    - ',\s*(ON|BC|AB|QC|MB|SK|NS|NB)\b'
  # Known false positives. Matching spans are removed from the string BEFORE the
  # include test, so "Seattle, WA; Toronto, ON" still passes but "Vancouver, WA" does not.
  # "United States"/"USA" need no entry: a string with no Canadian location left is dropped.
  exclude:
    - 'Vancouver,?\s+(Washington|WA)\b'
    - 'Ottawa,?\s+(Illinois|IL)\b'
    - '\b(Waterloo|Markham|Edmonton),?\s+(Wisconsin|WI|Iowa|IA|Illinois|IL|Kentucky|KY|Nebraska|NE|Belgium|BE|Brussels)\b'
    # "Ontario, CA" and nothing else is Ontario, California (an Owens & Minor warehouse job reached the Feed); "Toronto, Ontario,
    # CA" keeps its city and passes. The whole-string anchors keep "Remote, Ontario, CA" (Canada) alone.
    - '^\s*Ontario,\s*(?:CA|California)\s*$'
  exclude_cs:
    - ',\s*WA\b'
  split_on: '[;|]'   # multi-location strings are split on this; first Canadian part is used
  # The owner cannot work in French: a job is dropped when EVERY Canadian location it lists is in
  # Quebec. A posting that also lists a non-Quebec location or "Remote, Canada" is kept.
  quebec:
    - '\b(Montr[ée]al|Qu[ée]bec|Laval|Gatineau|Longueuil|Sherbrooke|L[ée]vis|Saint-Laurent|St\.?\s+Laurent)\b'
  quebec_cs:             # province abbreviation, case-sensitive
    - ',\s*QC\b'
    - '\bQC\s*[,-]'
    - '^QC$'
  # Workday lists "2 Locations" and keeps the real list in the job detail (additionalLocations).
  # These pass the location stage unresolved; phase 2 reads the list. Unresolvable ones are kept.
  unresolved: '^\s*\d+\s+Locations?\s*$'
  # ... and when the list cannot be read (403, no JD) the job is kept only if the primary location in its
  # URL is Canadian (or Quebec). Set true to keep every such job, whatever its URL says.
  keep_unresolved_with_foreign_url: false
  # A title that names a place outside Canada, and no Canadian one, fails the location stage even when the
  # location field says Canada: TribalScale listed "Forward Deployed Engineer (Washington, D.C.)" as "Remote Canada".
  # Whole words, case-insensitive. Ambiguous names (London, Paris, Cambridge: also Ontario towns) are left out.
  title_foreign:
    - 'United States|America(?:n)?-based'
    - 'Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|West Virginia|Wisconsin|Wyoming'
    - 'Washington,?\s*D\.?\s?C\.?|Washington State|San Francisco|Bay Area|Silicon Valley|Los Angeles|LA-based|Seattle|Boston|Chicago|Austin|Dallas|Houston|Denver|Atlanta|Miami|Fort Lauderdale|Philadelphia|Pittsburgh|San Diego|San Jose|Palo Alto|Mountain View|Menlo Park|Sunnyvale|Redwood City|Raleigh|Nashville|Minneapolis|Detroit|Salt Lake City|Las Vegas|Orlando|Tampa|Portland|Kirkland|Bellevue|Redmond|Phoenix'
    - 'United Kingdom|England|Scotland|Ireland|Dublin|India|Bangalore|Bengaluru|Hyderabad|Pune|Chennai|Gurugram|Gurgaon|Noida|Germany|Berlin|Munich|Netherlands|Amsterdam|Poland|Warsaw|Mexico|Brazil|Philippines|Manila|Singapore|Australia|Sydney|Japan|Tokyo|Israel|Tel Aviv|Spain|Madrid|Portugal|Lisbon|Argentina|Costa Rica'
  title_foreign_cs:            # case-sensitive abbreviations
    - 'US|USA|U\.S\.(?:A\.)?|NYC|UK|EMEA|APAC|LATAM'

title:
  # Two tiers. "strong" terms pass outright; "weak" terms are generic words that
  # are kept but tagged weak_title (phase 2 drops them if the JD shows no skill fit).
  strong:
    - software
    - developer
    - programmer
    - data
    - machine learning
    - cloud
    - devops
    - platform
    - backend
    - back end
    - frontend
    - front end
    - full stack
    - full-stack
    - fullstack
    - security
    - cyber
    - database
    - analytics
    - automation
  strong_words:          # short acronyms: whole-word match, case-insensitive
    - ML
    - AI
    - SRE
    - BI
  weak:
    - engineer
    - analyst
    - specialist
    - test
    - technical
    - technology           # "Graduate Rotational Program (Technology)": a weak word, so the JD must show a skill fit
    - network              # "Network Administrator" / "Network Operations": entry-level IT the audit showed was lost
    - systems
    - sysadmin
    - help desk
    - helpdesk
    - service desk
    - desktop support
    - information technology
    - information systems
    - computer
    - informatics
    - firmware
    - embedded
    - hardware
    - robotics
    - system administrator
    - systems administrator
    - network administrator
    - server administrator
    - linux administrator
    - windows administrator
    - scientist
    - integration
  weak_words:
    - QA
    - web                  # "Web Designer", "CMS and Web Administrator" (whole word: not "Webber")
  weak_words_cs:         # short acronyms, upper case only ("IT Support", not "it")
    - IT
    - SQL
    - API
    - ETL
    - DBA
    - UX
    - UI
    - SDET
    - NOC
  exclude:
    - senior
    - marketing
    - supervisor
    - superviseur
    - administrative
    - clerk
    - facilities
    - staff
    - principal
    - manager
    - director
    - head of
    - chief
    - intermediate
    - mechanical
    - electrical engineer
    - civil
    - structural
    - chemical
    - process engineer
    - manufacturing
    - HVAC
    - field service
    - sales
    - security guard
    - team leader
    - recruiter
    - vice president
    - vice-president
    - avp
    - assistant vice
    - concierge
    - attendant
    - parking
    - security officer
    - custodian
    - teacher
    - recreation          # city halls: "Recreation Programmer" is a recreation job, not a developer
    - lecturer
    - sessional
    - professor
  exclude_if_weak:       # excluded only when the title's tech match is a generic word (engineer, analyst, specialist ...);
    - coordinator
    - technician
                         # a strong one ("IT Coordinator", "Data Coordinator", "Cloud Technician") passes
  exclude_words:
    - sr
    - guard
    - VP
    - lead
    - architect
    - architects
  # Whole words / phrases, case- and accent-insensitive ("Directeur", "directeur" and "Directrice" all hit).
  exclude_phrases:
    - directeur
    - directrice
    - director
    - expert
    - phd
    - customer support specialist
    - support specialist, data
    - customer service
    - client support
    - sales support specialist
    - member support specialist
    # "IT Support Specialist" / "Technical Support Specialist" are entry-level tech jobs a new graduate applies to: they are
    # a weak title, so the JD must show a skill fit (the audit found them dropped by the old plain "support specialist" rule).
    - help improve ai
    - english speaker
    - flexible work
    - data annotation
    - data labeling
    - ai trainer
    # non-tech roles that leaked into the Feed (SPEC §11 #67)
    - business developer
    - business development
    - distinguished
    - crew
    - electrician
    - journeyperson
    - operator
    - investigator
    - underwriter
    - artist
    - loss prevention
    - store
    - security agent
    # sales, success and recruiting roles that the watchlist's employers post under "Engineer" / "Specialist"
    - account executive
    - account manager
    - account specialist
    - customer success
    - talent acquisition
  exclude_words_cs:      # roman-numeral levels, case-sensitive
    - II
    - III
    - IV
  # Student-only roles. Phase 2 may rescue these when the JD says recent grads are eligible.
  student:
    - intern
    - internship
    - interns
    - co-op
    - coop
    - student
    - students
    - PEY
  student_regex:
    - '\b(summer|winter|fall)\s+20\d\d\b'
  grad_signal:           # ... unless the title also says it is for graduates (the season only says when it starts)
    - '\bnew[\s-]?grad'
    - '\brecent\s+grad'
    - '\bgraduate\s+(?:program|programme|role|rotation|developer|engineer|analyst|scientist)'
    - '\bearly[\s-]career'
    - '\bentry[\s-]level'
    - '\brotational'

company:
  blocklist:             # normalised (lowercase, alphanumeric) substring match
    - jobgether
    - usasurveyjob
    - globalhr
    - tsmg
    - mthree                 # train-and-place program, every variant ("mthree Recruiting Portal", ...)
    - liftedsolutions        # AI-training gig work
    - liftedanupworkcompany  # same company under its SmartRecruiters slug

language:
  drop_french_titles: true
  french_pattern: 'analyste|ing[ée]nieur|d[ée]veloppeur|conseill|scientifique|sp[ée]cialiste'
  # A title that also has one of these English role words is bilingual, not French-only.
  english_role_words: [engineer, developer, analyst, scientist, specialist, consultant, programmer, architect]
  # "Développeur de logiciels / Software Developer": when the part before " / " is French the job is
  # dropped even though an English role word follows. Accented letters or any of these words flag it.
  french_first_segment_pattern: '\b(de|du|des|la|le|les|et|pour|chez|aux|en|sur|avec|logiciels?|ing[ée]nieure?|d[ée]veloppeu\w+|analyste|conseill\w+|gestionnaire|charg[ée]e?|technicien\w*|stagiaire|administrateur\w*|architecte)\b|[àâçéèêëîïôûùü]'
  drop_french_required_jd: true   # JD requires French / bilingual skills (a passing mention is not enough)

report:
  path: reports/latest.md
  dropped_path: reports/dropped.md   # the jobs the JD rules dropped, by reason (so a wrong rule can be seen)

jd:
  enabled: true
  workers: 8                 # thread pool; the client still enforces per-host/per-ATS limits
  request_delay: 0.3         # seconds between requests to one host
  host_delays:               # hosts that ask for more: Job Bank's robots.txt has Crawl-delay 5
    www.jobbank.gc.ca: 5
  max_per_ats: 5
  cache_dir: .cache/jd       # successful fetches are cached by URL
  cache_ttl_days: 10         # as long as the freshness window: a job still in the window is not downloaded again
  min_years_drop: 3          # drop when the minimum required experience (lower bound) is >= this
  two_year_signal: "2+ yrs"  # lower bound of 2 years: kept, with this Signal, unless a rule below drops it
  two_year_drops: false      # true: drop a 2-year job unless Fit reaches two_year_min_fit and internships count. False: keep it with the
                             # signal above (a posting that asks 2 years often takes a new graduate; a missed good job costs more than an extra row)
  two_year_min_fit: 0.6      # ... Fit (a fraction, like the Feed's Fit % column) must reach this for a 2-year job
  peng_signal: "P.Eng req"   # Signal when the JD requires a P.Eng licence (not when an EIT is accepted); never a drop
  min_judge_chars: 600       # a JD shorter than this is too thin to judge a generic title by
  keep_without_jd: true      # a job whose description cannot be read (403, unsupported site, timeout) is still written to the Feed,
                             # marked "jd unavailable" and ranked lower: you can open the link and read it yourself
  no_jd_title_exclude:       # for a job whose JD could not be read AND whose title is generic ("Specialist", "Analyst"): these words
    - warehouse              # name a field that is not tech, so there is nothing to vouch for it. Everything else with no JD is kept.
    - retail
    - greenlight
    - f&i
    - events
    - member services
    - client service
    - shoring
    - library
    - regional engagement
    - pharmac
    - nurs
    - dental hygien
  rescue_student_titles: true  # fetch JDs of student-titled jobs; keep those that welcome recent grads

scoring:
  weak_title_strict: false   # true: the old rule below (a generic title needs min_terms_for_fit skill terms and weak_title_min_fit % Fit)
  weak_title_min_terms: 1    # default rule: a generic title (Analyst, Specialist, Engineer ...) is dropped only when a JD of at least
                             # jd.min_judge_chars names fewer skill terms than this (so: none at all)
  weak_few_terms_keep:       # a generic title that also matches one of these is never dropped by the rule above
    - '\bengineer'
    - '\b(?:it|information technology|technology|technical support|software|developer|data|devops|cloud|cyber|security|automation|programmer)\b'
  weak_title_min_fit: 20     # (strict rule) a weak_title job is dropped if Fit % is below this or no skill matches
  # A `low signal` job (JD found, Fit % n/a) is kept only when its title names a developer role: a JD with too few
  # tech terms and a title like "Cell Operator" or "Underwriter" is not a tech job. Whole words, plural allowed.
  low_signal_title_nouns: [engineer, developer, programmer, scientist, analyst]
  low_signal_title_drop: false    # true: apply the rule above. False (default): such a job is kept and shown as "low signal"; the rule had
                                  # dropped "Information Security Specialist - PCI DSS" and "Consultant, Data Risk"
  min_terms_for_fit: 4       # Fit % needs this many distinct terms (matched + gaps + context); fewer -> n/a + `low signal`
  min_core_terms_for_fit: 2  # ... of which at least this many skills or gaps (one skill and three generic words is not a fit)
  matched_bonus_per_skill: 2 # ranking Score += this per matched skill ...
  matched_bonus_cap: 10      # ... counting at most this many skills
  boost:
    new_grad: 15             # JD/title has "new grad" or "recent graduate"
    simplify: 10             # listed by the Simplify new-grad feed or the curated Canada list
    bc_or_remote: 5
    fresh:                   # a ten-day window lets an old posting outrank today's on Fit alone: favour the new ones.
      days: 4                # +bonus when posted just now, fading to 0 at this age
      bonus: 6
  penalty:
    no_jd: 10
  bc_or_remote_pattern: '\bBC\b|British Columbia|Vancouver|Burnaby|Victoria|Richmond|Surrey|\bremote\b'

cluster:
  # The title decides the cluster; JD terms are used only when the title has no keyword.
  # Clusters are checked in this order and the first hit wins, so "Data Scientist" is ml
  # and "AI Security Analyst" is security. No keyword and no JD terms -> `default`.
  title_keywords:
    security: {terms: [security, cyber]}
    ml: {terms: [machine learning, scientist], words: [ML, AI]}
    data: {terms: [data, analytics], words: [BI]}
  default: software

notion:
  api_version: "2026-03-11"   # Notion-Version header; 2026-03-11 renamed `archived` to `in_trash`
  daily_cap: 150              # at most this many rows written per run, highest Score first (a ten-day window and ~150 boards
                              # find several hundred jobs; the owner wants them all, so the cap is a safety valve, not a filter)
  verify_readback_min_chars: 4000   # after writing, read back a JD at least this long and compare lengths
  # Property names exactly as they appear in the Feed. The scanner never writes `interested` / `apply` /
  # `done_del`. At the start of each run it trashes the rows whose `done_del` box is ticked (the owner's
  # automation ticks it after copying the row to the main database) and no other row.
  properties:
    name: Name
    company: Company
    link: Link
    source: Source
    fit: "Fit %"
    signals: Signals
    location: Location        # optional: filled when the Feed has the column, ignored when it does not
    jd: JD
    interested: Interested
    apply: Apply
    done_del: done-del

state:
  dir: state                  # seen.json (rows already written) and gaps.json
  prune_days: 90

feedback:
  report_path: reports/feedback.md   # what was picked, by Fit band / source / tag (counts only), from state/feedback.json

gaps:
  report_path: reports/gaps.md   # rewritten every Monday (UTC)

applied:
  path: state/applied.json.enc    # Fernet-encrypted; key in env APPLIED_KEY (repo secret). Never commit plaintext

