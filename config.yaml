# Everything tunable for the scanner lives here (SPEC §4, §10).
# Regexes are Python `re` syntax. Patterns under `*_cs` are case-sensitive;
# all others are case-insensitive.

freshness:
  default_days: 3        # normal run: only jobs first seen in the last N days
  first_run_days: 14     # reserved for the first run once state/seen.json exists (phase 3)

sources:
  feashliaa:
    enabled: true
    repo_url: https://github.com/Feashliaa/job-board-data
    cache_dir: .cache/job-board-data
    stale_after_hours: 36   # warn (and continue) if metadata last_updated is older
  simplify:
    enabled: true
    listings_url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
    categories:             # Simplify has used a few spellings for the same buckets
      - Software
      - Software Engineering
      - AI/ML/Data
      - Data Science, AI & Machine Learning

location:
  # Names that are unambiguous on their own.
  include:
    - '\bCanada\b'
    - '\b(Ontario|British Columbia|Alberta|Quebec|Québec|Manitoba|Saskatchewan|Nova Scotia|New Brunswick|Newfoundland|Prince Edward Island)\b'
    - '\b(Toronto|Vancouver|Montr[ée]al|Ottawa|Waterloo|Kitchener|Calgary|Edmonton|Burnaby|Mississauga|Markham|Kanata|Gatineau|Winnipeg|Regina|Saskatoon|Oakville)\b'
    # Names shared with places outside Canada: require a province qualifier.
    - '\b(Victoria|Richmond|Surrey|Hamilton|London|Halifax),?\s+(BC|ON|NS|British Columbia|Ontario|Nova Scotia)\b'
    - 'Remote\s*\(?\s*Canada'
    - 'Canada\s*[-–]\s*Remote'
  # Province suffixes, case-sensitive so ", on" in prose does not match.
  include_cs:
    - ',\s*(ON|BC|AB|QC|MB|SK|NS|NB)\b'
  # Known false positives. Matching spans are removed from the string BEFORE the
  # include test, so "Seattle, WA; Toronto, ON" still passes but "Vancouver, WA" does not.
  # "United States"/"USA" need no entry: a string with no Canadian location left is dropped.
  exclude:
    - 'Vancouver,?\s+(Washington|WA)\b'
    - 'Ottawa,?\s+(Illinois|IL)\b'
    - '\b(Waterloo|Markham|Edmonton),?\s+(Wisconsin|WI|Iowa|IA|Illinois|IL|Kentucky|KY|Nebraska|NE)\b'
  exclude_cs:
    - ',\s*WA\b'
  split_on: '[;|]'   # multi-location strings are split on this; first Canadian part is used

title:
  include:
    - software
    - developer
    - engineer
    - programmer
    - data
    - analytics
    - machine learning
    - scientist
    - devops
    - platform
    - cloud
    - backend
    - back end
    - full stack
    - full-stack
    - fullstack
    - frontend
    - front end
    - automation
    - test
    - security
    - cyber
    - database
    - integration
  # Short acronyms are matched as whole words, case-insensitive.
  include_words:
    - ML
    - AI
    - SRE
    - QA
    - BI
  exclude:
    - senior
    - staff
    - principal
    - manager
    - director
    - head of
    - chief
    - intermediate
    - mechanical
    - electrical engineer
    - civil
    - structural
    - chemical
    - process engineer
    - manufacturing
    - HVAC
    - field service
    - technician
    - sales
    - security guard
    - clerk
  exclude_words:
    - sr
    - VP
    - lead
    - architect
    - architects
  exclude_words_cs:      # roman-numeral levels; case-sensitive so "Engineer ii" typos don't matter
    - II
    - III
    - IV
  # Student-only roles. Phase 2 may rescue these when the JD says recent grads are eligible.
  student:
    - intern
    - internship
    - interns
    - co-op
    - coop
    - student
    - students
    - PEY
  student_regex:
    - '\b(summer|winter|fall)\s+20\d\d\b'

company:
  blocklist:             # normalised (lowercase, alphanumeric) substring match
    - jobgether
    - usasurveyjob
    - globalhr
    - tsmg

language:
  drop_french_titles: true
  french_pattern: 'analyste|ing[ée]nieur|d[ée]veloppeur|conseill|scientifique|sp[ée]cialiste'
  # A title that also has one of these English role words is bilingual, not French-only.
  english_role_words: [engineer, developer, analyst, scientist, specialist, consultant, programmer, architect]

report:
  path: reports/latest.md
