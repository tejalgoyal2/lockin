      aliases: [requirements gathering, requirement gathering, requirements elicitation, gathering requirements, gather requirements]
      regex: ['(?i)\bgather(?:ing)?\s+(?:business\s+|technical\s+|user\s+)?requirements\b']
    - {name: UAT, aliases: [user acceptance testing], regex: ['\bUAT\b']}
