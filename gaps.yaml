# Common tech terms that are NOT in skills.yaml, so JD gaps are visible (SPEC §5).
# Same entry format as skills.yaml. Move a term to skills.yaml once you have it.
terms:
  - {name: Java, aliases: [Java]}
  # Plain "Go" is also an English word, so it only counts in a language list ("such as Go, Python, or Java").
  - name: Go
    aliases: [Golang, Go/Golang, Go programming]
    regex: ['\b(?:such as|like|including|and|or|in|with)\s+Go(?=\s*(?:[,;/)]|\.|\band\b|\bor\b|$))',
            '[,/(]\s*Go(?![A-Za-z])(?!\s+(?:to|beyond|ahead|live|above|the|for)\b)']
