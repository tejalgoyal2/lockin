# TEMPORARY: runs the three Phase 3 live tests against the real Notion Feed.
# Triggers only when this file changes on the PR branch. Deleted before merge.
name: phase3-live-test

on:
  push:
    branches: [claude/phase-3-notion-feed]
    paths: [".github/workflows/phase3-live-test.yml"]

permissions:
  contents: write

concurrency:
  group: phase3-live-test
  cancel-in-progress: false

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_FEED_DATA_SOURCE_ID: ${{ secrets.NOTION_FEED_DATA_SOURCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Secrets are present
        run: |
          test -n "$NOTION_TOKEN" || { echo "NOTION_TOKEN is not set"; exit 1; }
          test -n "$NOTION_FEED_DATA_SOURCE_ID" || { echo "NOTION_FEED_DATA_SOURCE_ID is not set"; exit 1; }
          echo "both secrets are set"

      - name: "BOOTSTRAP: record the 5 rows already in the Feed in state/seen.json (writes nothing)"
        run: |
          python -m scanner run --since 14 --top 5 --max-rows 5 --gaps-report always | tee /tmp/bootstrap.log
          grep -E "^Notion: 0 to write" /tmp/bootstrap.log
          grep -E "^Notion: wrote 0 rows, 0 failed" /tmp/bootstrap.log
          test -s state/seen.json && python -c "import json; d=json.load(open('state/seen.json')); print('seen.json keys:', len(d['seen']))"

      - name: Commit state and reports to the PR branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state reports
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "live test: state and reports [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              echo "push failed (attempt $i); retrying"; sleep $((i * 5))
            done
            exit 1
          fi
