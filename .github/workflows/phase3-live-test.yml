# TEMPORARY: runs the three Phase 3 live tests against the real Notion Feed.
# Triggers only when this file changes on the PR branch. Deleted before merge.
name: phase3-live-test

on:
  push:
    branches: [claude/phase-3-notion-feed]
    paths: [".github/workflows/phase3-live-test.yml"]

permissions:
  contents: write

concurrency:
  group: phase3-live-test
  cancel-in-progress: false

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_FEED_DATA_SOURCE_ID: ${{ secrets.NOTION_FEED_DATA_SOURCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Secrets are present
        run: |
          test -n "$NOTION_TOKEN" || { echo "NOTION_TOKEN is not set"; exit 1; }
          test -n "$NOTION_FEED_DATA_SOURCE_ID" || { echo "NOTION_FEED_DATA_SOURCE_ID is not set"; exit 1; }
          echo "both secrets are set"

      - name: "TEST 1: dry run, first 5 payloads (reads the real Feed, writes nothing)"
        run: python -m scanner run --since 14 --dry-run --top 5 --show-payloads 5 --gaps-report always | tee /tmp/test1.log

      - name: "TEST 2: real run capped at 5 rows (+ read back one JD over 4,000 chars)"
        run: |
          python -m scanner run --since 14 --top 5 --max-rows 5 | tee /tmp/test2.log
          grep -E "^Notion: wrote 5 rows, 0 failed" /tmp/test2.log
          grep -E "^Notion: read-back OK" /tmp/test2.log

      - name: "TEST 3: rerun with identical flags must write 0 new rows"
        run: |
          python -m scanner run --since 14 --top 5 --max-rows 5 | tee /tmp/test3.log
          grep -E "^Notion: 0 to write" /tmp/test3.log
          grep -E "^Notion: wrote 0 rows, 0 failed" /tmp/test3.log

      - name: "TEST 3b: rerun with seen.json deleted: the Link check alone must still write 0 rows"
        run: |
          cp state/seen.json /tmp/seen.json.bak
          rm state/seen.json
          python -m scanner run --top 5 --max-rows 5 --since 14 | tee /tmp/test3b.log
          grep -E "^Notion: 0 to write" /tmp/test3b.log
          cp /tmp/seen.json.bak state/seen.json

      - name: Commit state and reports to the PR branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state reports
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "live test: state and reports [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
