name: tmp-feed-rescore
on:
  push:
    branches: [tmp/feed-rescore]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rescore the Feed
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_FEED_DATA_SOURCE_ID: ${{ secrets.NOTION_FEED_DATA_SOURCE_ID }}
        run: |
          mode=$(cat tmp-mode.txt)
          echo "mode: $mode"
          if [ "$mode" = "apply" ]; then python -m scanner clean-feed --rescore; else python -m scanner clean-feed --rescore --dry-run; fi
