name: scan

on:
  schedule:
    # Two runs a day, morning and late afternoon. GitHub cron is UTC only and has no time zones, so the slots sit between
    # the two Pacific offsets: 15:57 UTC is 07:57 PST (winter) / 08:57 PDT (summer); 23:57 UTC is 15:57 PST / 16:57 PDT.
    # GitHub starts a scheduled run a few minutes to an hour after its slot (more on the hour: hence the odd minutes),
    # which lands the morning run in 8-9 am and the afternoon one in 4-5 pm.
    # The dataset (Feashliaa) always finishes by 18:15 UTC, so the afternoon run sees the day's data.
    # GitHub also drops a scheduled run now and then; the 10-day window (config.yaml) picks the jobs up on the next one,
    # and a run only writes jobs not already seen, so nothing comes twice.
    - cron: "57 15 * * *"       # ~08:00 Pacific
    - cron: "57 23 * * *"       # ~16:00 Pacific
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: scan and report, write nothing to Notion"
        type: boolean
        default: true
      max_rows:
        description: "Rows to write this run (blank = notion.daily_cap in config.yaml)"
        type: string
        required: false
      since_days:
        description: "Only jobs first seen in the last N days (blank = 10, from config.yaml; 14 or 30 to catch up after a break)"
        type: string
        required: false

permissions:
  contents: write                # commit state/ and reports/ back

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --require-hashes -r requirements.txt   # every package pinned by hash (requirements.in)

      # Job descriptions already downloaded (config.yaml jd.cache_dir, 10-day TTL). Without this every run downloads
      # the JD of every candidate in the 10-day window again, twice a day. A new entry is saved per run; GitHub
      # drops entries unused for 7 days.
      - name: Restore the JD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/jd
          key: jd-${{ github.run_id }}
          restore-keys: jd-

      - name: Scan and write to the Notion Feed
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_FEED_DATA_SOURCE_ID: ${{ secrets.NOTION_FEED_DATA_SOURCE_ID }}
          APPLIED_KEY: ${{ secrets.APPLIED_KEY }}     # decrypts state/applied.json.enc in memory; optional
          # Inputs go through env vars, never straight into the script.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          MAX_ROWS: ${{ inputs.max_rows }}
          SINCE_DAYS: ${{ inputs.since_days }}
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$MAX_ROWS" ] && args+=(--max-rows "$MAX_ROWS")
          [ -n "$SINCE_DAYS" ] && args+=(--since "$SINCE_DAYS")
          python -m scanner run "${args[@]}"

      - name: Prune the JD cache
        if: always()
        run: find .cache/jd -type f -mtime +10 -delete 2>/dev/null || true     # past the TTL: never read again

      - name: Commit state and reports
        if: always()             # rows already written must reach seen.json even if the run failed later
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state reports watchlist.auto.yaml
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "scan: update state and reports [skip ci]"
            # GitHub occasionally answers a push with a transient 5xx: retry with backoff.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              echo "push failed (attempt $i); retrying"; sleep $((i * 5))
            done
            exit 1
          fi
