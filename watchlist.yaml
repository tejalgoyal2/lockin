# Employer job boards read directly on every run (scanner/sources/watchlist.py; README "Watchlist").
#
# Why a board is here: the Feashliaa dataset refreshes once a day and does not list every employer, while a board
# listed here is asked live, so the morning run sees today's postings. Every board below was checked on 2026-11-05
# against its public API; the Canadian-job counts are from that day and only say why it was worth adding.
#
# To add one: open the employer's careers page and look at where "Apply" goes.
#   boards.greenhouse.io/<slug> or job-boards.greenhouse.io/<slug>  ->  ats: greenhouse
#   jobs.lever.co/<slug>                                             ->  ats: lever   (the slug can contain a dot)
#   jobs.ashbyhq.com/<slug>                                          ->  ats: ashby
# `name` is the readable company name shown in the Feed.
#
#   <tenant>.wdN.myworkdayjobs.com/<site>                            ->  ats: workday, slug: <tenant>.wdN/<site>
#   jobs.smartrecruiters.com/<company>                               ->  ats: smartrecruiters
# Workday boards are read through the tenant's own country filter (Canada only) where it has one, else the whole
# board (up to 1,000 postings). Find more employers with `python -m scanner discover "Name"` (or `--workday ...`).
#
#   <host>/<country>/<language> of a Phenom People careers site     ->  ats: phenom, slug: jobs.bell.ca/ca/en
#   <host> of a SuccessFactors careers site (it has /search/ and /job/<words>/<number>/ pages)  ->  ats: successfactors, slug: careers.telus.com
# `python -m scanner discover` checks any of these (--workday, --phenom, --successfactors) and prints the line.
#
# Boards the scanner finds by itself are appended to watchlist.auto.yaml (README: "It grows by itself").
# Employers on Taleo, iCIMS, UltiPro or their own site cannot be listed here (see README).

